---
# Single inventory for the whole cluster.
# Workers are NOT split into cpu/gpu groups: the OS family decides the profile
# (RedHat -> cpu, Debian -> gpu). See group_vars/all.yml (node_pool).
all:
  vars:
    ansible_user: ansible            # CHANGE: your SSH user (needs passwordless sudo)
  children:
    control_plane:
      hosts:
        isu-k8s-cp:
          ansible_host: 172.18.0.101
        stpi-k8s-master:
          ansible_host: 172.26.0.8
        gcp-k8s-master:
          ansible_host: 10.10.1.26
    workers:
      hosts:
        isu-k8s-wk-4:                # Rocky Linux 9.x -> cpu profile
          ansible_host: 172.21.1.16
        gpu-k8s-wk-1:                # Ubuntu 22.04    -> gpu profile
          ansible_host: 10.10.1.60   # EXAMPLE IP: replace with your GPU node

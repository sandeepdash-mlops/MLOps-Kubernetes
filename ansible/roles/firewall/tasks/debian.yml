---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH first so enabling ufw never locks us out
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp

- name: Allow worker TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | replace('-', ':') }}"
    proto: tcp
  loop: "{{ firewall_tcp_ports }}"

- name: Allow worker UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | replace('-', ':') }}"
    proto: udp
  loop: "{{ firewall_udp_ports }}"

- name: Enable ufw (opt-in)
  community.general.ufw:
    state: enabled
  when: firewall_enable_ufw | bool

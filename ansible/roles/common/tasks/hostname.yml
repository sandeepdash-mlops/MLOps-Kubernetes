---
- name: Check whether this node already joined a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: common_kubelet_conf

- name: Refuse to rename a node that is already part of the cluster
  ansible.builtin.assert:
    that: not (common_kubelet_conf.stat.exists and ansible_hostname != inventory_hostname)
    fail_msg: >-
      {{ ansible_hostname }} is already joined and does not match its inventory name
      {{ inventory_hostname }}. Renaming a joined node breaks its kubelet identity.
      Follow "Failure Case 2" in ha-cluster-setup.txt instead.
    quiet: true

- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

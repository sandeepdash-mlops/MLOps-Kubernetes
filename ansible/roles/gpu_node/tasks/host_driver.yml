---
- name: Install kernel headers and the NVIDIA driver
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - "{{ gpu_node_host_driver_package }}"
    state: present
    update_cache: true
  register: gpu_node_driver_install

- name: Remember that the driver changed
  ansible.builtin.set_fact:
    gpu_node_host_driver_changed: "{{ gpu_node_driver_install.changed }}"

- name: Download the NVIDIA container toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the NVIDIA container toolkit apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      {{ gpu_node_toolkit_repo_base }}/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} /
    filename: nvidia-container-toolkit
    state: present

- name: Install the NVIDIA container toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Configure CRI-O to use the NVIDIA runtime
  ansible.builtin.command: >-
    nvidia-ctk runtime configure --runtime=crio --set-as-default
    --config=/etc/crio/crio.conf.d/99-nvidia.conf
  args:
    creates: /etc/crio/crio.conf.d/99-nvidia.conf
  notify: Restart crio

- name: Check the driver (fails until the node is rebooted after a fresh install)
  ansible.builtin.command: nvidia-smi -L
  register: gpu_node_smi
  changed_when: false
  failed_when: false

- name: Show detected GPUs
  ansible.builtin.debug:
    var: gpu_node_smi.stdout_lines
